# Сборка APK приложения «Айкидо — Program za polaganje» для секции,
# проверка его запуска в эмуляторе Android и выкладка в выпуск по тегу
# v*. Страница и ролики: страница своя внутри APK (Capacitor 8), ролики
# играет плеер YouTube — серверов у приложения нет.
#
# Подпись: ключ из секретов AIKIDO_SEKCIYA_KEYSTORE_B64 /
# AIKIDO_SEKCIYA_KEYSTORE_PASS / AIKIDO_SEKCIYA_KEY_ALIAS /
# AIKIDO_SEKCIYA_KEY_PASS — если секретов нет, APK собирается
# debug-подписью (для установки людям её хватает; подписанный одним
# ключом APK ставится поверх того же приложения). Сторонние действия —
# по полному хэшу коммита. Выпуск — только после проверки запуска:
# непроверенный APK в релиз не уходит.
name: Сборка APK и проверка запуска

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
          gradle-version: "8.11.1"
      - name: Зависимости
        run: npm install --no-audit --no-fund
      - name: Платформа Android
        run: npx cap add android
      - name: Значок, номер сборки, без EmojiCompat и без cleartext
        env:
          AIKIDO_SEKCIYA_APP_VERSION_CODE: "${{ github.run_number }}"
        run: node scripts/podgotovit-android.cjs
      - name: Синхронизация Capacitor
        run: npx cap sync android
      # ключ подписи — секреты AIKIDO_SEKCIYA_*: есть — APK подписывается
      # своим ключом; нет — debug-сборка
      - name: Ключ подписи приложения из секретов
        env:
          AIKIDO_SEKCIYA_KEYSTORE_B64: "${{ secrets.AIKIDO_SEKCIYA_KEYSTORE_B64 }}"
        run: test -n "$AIKIDO_SEKCIYA_KEYSTORE_B64" && umask 077 && printf '%s' "$AIKIDO_SEKCIYA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.jks" || echo "секретов ключа нет — будет debug-подпись"
      - name: Сборка APK (release с ключом или debug без)
        working-directory: android
        run: chmod +x ./gradlew && if [ -f "$RUNNER_TEMP/app.jks" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: Подпись и проверка APK
        env:
          AIKIDO_SEKCIYA_KEYSTORE_PASS: "${{ secrets.AIKIDO_SEKCIYA_KEYSTORE_PASS }}"
          AIKIDO_SEKCIYA_KEY_ALIAS: "${{ secrets.AIKIDO_SEKCIYA_KEY_ALIAS }}"
          AIKIDO_SEKCIYA_KEY_PASS: "${{ secrets.AIKIDO_SEKCIYA_KEY_PASS }}"
        run: tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)" && mkdir -p out && if [ -f "$RUNNER_TEMP/app.jks" ]; then "$tools/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/razravnennyj.apk && "$tools/apksigner" sign --ks "$RUNNER_TEMP/app.jks" --ks-key-alias "$AIKIDO_SEKCIYA_KEY_ALIAS" --ks-pass "pass:$AIKIDO_SEKCIYA_KEYSTORE_PASS" --key-pass "pass:$AIKIDO_SEKCIYA_KEY_PASS" --out out/aikido-sekciya.apk out/razravnennyj.apk && rm -f out/razravnennyj.apk; else cp android/app/build/outputs/apk/debug/app-debug.apk out/aikido-sekciya.apk; fi && "$tools/apksigner" verify out/aikido-sekciya.apk
      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/app.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aikido-sekciya-apk
          path: out/aikido-sekciya.apk
          retention-days: 10
          if-no-files-found: error

  # Запуск собранного APK в эмуляторе Android с KVM: установка, запуск,
  # страница в фокусе, страница ролика — плеер YouTube или ссылка
  # «Открыть в YouTube» (подробности — proverka/zapustit-proverku.sh и
  # proverka/sobrat-otchet.cjs). Отчёт otchet-zapuska.json и снимки —
  # артефактом; любой красный пункт отчёта делает работу красной.
  zapusk:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: aikido-sekciya-apk
          path: apk
      - name: KVM для эмулятора — правило udev
        run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Эмулятор — установка, запуск, страница ролика
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          # WebView-приложению службы Google не нужны: на google_apis их
          # окна ANR отнимали передний план — эмулятор target: default
          target: default
          force-avd-creation: false
          # эмулятору — по возможностям машины GitHub (ubuntu-latest:
          # 4 vCPU, 16 ГБ RAM): 4 ядра и 6 ГБ — на голых 2 ядрах лаунчер
          # и службы ANR'ят без ресурса, а их окна перехватывают
          # передний план у приложения
          ram-size: 6144M
          cores: 4
          disable-animations: true
          emulator-options: "-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim"
          script: bash proverka/zapustit-proverku.sh
        env:
          REZ: "${{ runner.temp }}/rez"
          TEKHNIKA: Ikkyo
      - name: Отчёт и снимки — артефакт запуска
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aikido-sekciya-zapusk
          path: "${{ runner.temp }}/rez"
          retention-days: 10
          if-no-files-found: warn

  # APK — в выпуск репозитория по тегу v*, и только после проверки
  # запуска: непроверенный файл людям не отдаём
  reliz:
    needs:
      - apk
      - zapusk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: aikido-sekciya-apk
          path: apk
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: apk/aikido-sekciya.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
